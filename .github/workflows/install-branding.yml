name: Install supplied branding assets

on:
  push:
    paths:
      - 'branding-base64/**'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check banner chunks
        id: check
        shell: bash
        run: |
          count="$(find branding-base64/banner -type f -name '*.part' 2>/dev/null | wc -l)"
          if [ "$count" -ne 7 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Decode supplied banner
        if: steps.check.outputs.ready == 'true'
        shell: bash
        run: |
          mkdir -p assets
          cat $(find branding-base64/banner -type f -name '*.part' | sort) | base64 -d > assets/gptbc-banner.jpg
          file assets/gptbc-banner.jpg
          rm -rf branding-base64/banner
      - name: Commit banner
        if: steps.check.outputs.ready == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Install supplied GptBC banner artwork'
          git push
