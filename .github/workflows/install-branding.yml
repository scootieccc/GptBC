name: Install supplied branding assets

on:
  push:
    paths:
      - 'branding-base64/banner.b64'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode supplied banner
        shell: bash
        run: |
          mkdir -p assets
          base64 -d branding-base64/banner.b64 > assets/gptbc-banner.jpg
          file assets/gptbc-banner.jpg
          rm -f branding-base64/banner.b64
      - name: Commit banner
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Install supplied GptBC banner artwork'
          git push
